<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A tiny cheerful webpage hosted with GitHub Pages." />
    <title>My Happy Corner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <span class="eyebrow">My first GitHub Pages site</span>
      <div class="mascot" aria-hidden="true">
        <span class="eye left"></span>
        <span class="eye right"></span>
        <span class="smile"></span>
      </div>
      <h1>Hello, internet! <span aria-hidden="true">🌼</span></h1>
      <p>
        This little page lives in a GitHub repository and can be shared with
        anyone using GitHub Pages.
      </p>
      <button id="cheerButton" type="button">Send me some sunshine</button>
      <p id="message" class="message" aria-live="polite"></p>
    </main>

    <footer>Made with HTML, CSS, JavaScript, and a tiny bit of courage.</footer>
    <script src="script.js"></script>
  </body>
</html>
